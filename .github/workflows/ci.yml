name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B --no-transfer-progress verify

      # One green run says little about a concurrency suite: interleavings differ every time, and a race
      # that shows up in one run in ten would otherwise ship. Both modules carry one - ledger-core against
      # the ledger directly, ledger-app through a real socket - so both are repeated. The suite is seconds.
      - name: Repeat the test suites
        run: |
          for run in 1 2 3 4 5; do
            echo "::group::test suites, run $run"
            ./mvnw -B --no-transfer-progress test
            echo "::endgroup::"
          done
